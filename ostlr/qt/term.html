<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="stylesheet" href="vendor/xterm.css">
<!-- LXGW WenKai Mono (OFL-1.1): the bundled CJK monospace. Subsetted woff2 with
     unicode-range, so the browser picks the right chunk per character. -->
<link rel="stylesheet" href="fonts/wenkai/mono.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101216; overflow: hidden; }
  /* Padding lives on the WRAPPER, never on .xterm: the fit maths measures the
     wrapper, and padding on the terminal element makes it compute a grid that
     does not match what is drawn. */
  #terminal { position: absolute; inset: 0; padding: 4px 2px 2px 6px; box-sizing: border-box;
              /* Reserve the scrollbar gutter: otherwise fit() changes cols, the
                 scrollbar appears, the container narrows, fit() runs again - the
                 one-cell oscillation the user saw as jitter. */
              scrollbar-gutter: stable; }
  .xterm-viewport { overflow-y: scroll !important; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #2a2f38; border-radius: 5px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script>
  const FONT_SIZE = 14;

  // --- the font comes from Python ------------------------------------------
  // A terminal grid only stays aligned when advance(CJK) == 2 * advance(ASCII).
  // Measured here at 14 px: Consolas 7.70/14.00 = 1.819 (wrong), MS Gothic and
  // NSimSun 7.00/14.00 = 2.000 (right). Python passes the family (and, when one
  // is bundled, the font file), so the page never guesses.
  const query = new URLSearchParams(location.search);
  const fontFamily = query.get('font') ||
        "'LXGW WenKai Mono', SimHei, NSimSun, Consolas, monospace";
  const fontFile = query.get('fontfile') || '';
  if (fontFile) {
    // A bundled font wins over every system font, the way proJV keeps its own.
    const face = new FontFace('OstlrMono', 'url("' + fontFile + '")');
    document.fonts.add(face);
    face.load().catch(function () { /* keep the system stack */ });
  }

  const term = new Terminal({
    fontFamily: fontFamily,
    fontSize: FONT_SIZE,
    // Every glyph, box-drawing included, comes from the FONT. No special casing:
    // if the face draws `|`, `-` and the corners, they look like the rest of the
    // text by construction - matching is the font's job, not a second renderer's.
    customGlyphs: false,
    // Integer cell height: at a fractional height the drawn box glyphs leave a
    // hairline gap between rows, which reads as "the vertical bar is broken".
    lineHeight: 1.0,
    letterSpacing: 0,
    rescaleOverlappingGlyphs: true,
    lineHeight: 1.0,
    cursorBlink: true,
    allowProposedApi: true,
    theme: {
      background: '#101216', foreground: '#e6e6e6', cursor: '#7cc4ff',
      selectionBackground: '#2a3a4a',
      black: '#1a1d22', red: '#f06a6a', green: '#7ec97e', yellow: '#e2c07c',
      blue: '#6aa9f0', magenta: '#c88ae0', cyan: '#6fd0d0', white: '#d8d8d8',
      brightBlack: '#5a6068', brightRed: '#ff8a8a', brightGreen: '#a0e0a0',
      brightYellow: '#f0d89a', brightBlue: '#8ac0ff', brightMagenta: '#e0a8f0',
      brightCyan: '#9ae8e8', brightWhite: '#ffffff'
    },
    scrollback: 5000,
    convertEol: false,
  });
  term.open(document.getElementById('terminal'));
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);

  function cellSize() {
    // The renderer knows the real cell box. Asking it is the only reliable way:
    // measuring a span gives the page font, and a wrong box means a wrong grid -
    // which is how a TUI ended up drawing 30 columns into a 1500 px pane.
    try {
      const dims = term._core._renderService.dimensions;
      const cell = dims && (dims.css ? dims.css.cell : dims.actualCellWidth ? dims : null);
      if (cell && cell.width > 1 && cell.height > 1) {
        return { w: cell.width, h: cell.height };
      }
    } catch (e) { /* older builds */ }
    try {
      const ruler = document.createElement('div');
      ruler.textContent = 'M'.repeat(10);
      ruler.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;' +
                            'font-family:' + term.options.fontFamily + ';' +
                            'font-size:' + term.options.fontSize + 'px;' +
                            'line-height:' + term.options.lineHeight + ';';
      document.body.appendChild(ruler);
      const rect = ruler.getBoundingClientRect();
      document.body.removeChild(ruler);
      if (rect.width > 10) return { w: rect.width / 10, h: rect.height };
    } catch (e) { /* ignore */ }
    return { w: FONT_SIZE * 0.6, h: FONT_SIZE * 1.0 };
  }

  function fit() {
    const holder = document.getElementById('terminal');
    const width = holder.clientWidth;
    const height = holder.clientHeight;
    if (width < 40 || height < 30) return;
    const cell = cellSize();
    const cols = Math.max(20, Math.floor((width - 8) / cell.w));
    const rows = Math.max(5, Math.floor((height - 6) / cell.h));
    // A one-cell wobble is measurement noise, not a resize: acting on it makes
    // the whole TUI repaint for nothing. Only a real change (>1 cell) counts.
    if (Math.abs(cols - term.cols) <= 1 && Math.abs(rows - term.rows) <= 1) {
      return;
    }    if (cols !== term.cols || rows !== term.rows) {
      const alternate = term.buffer.active.type === 'alternate';
      const shrank = cols < term.cols || rows < term.rows;
      term.resize(cols, rows);
      // A terminal owns its display and conhost clears on a size change; xterm
      // keeps the old cells. Clear only when the grid SHRANK: then the previous
      // frame's borders sit outside the new layout and would survive. On growth
      // the extra area is blank already, and clearing there would race the
      // child's own repaint (a visibly washed-out frame).
      if (alternate && shrank) {
        term.write('\x1b[2J');
      }
    }
    send({ r: [term.cols, term.rows], alt: term.buffer.active.type === 'alternate' });
  }

  window.writeB64 = function (b64) {
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    term.write(new TextDecoder('utf-8', { fatal: false }).decode(bytes));
  };
  window.setStatus = function (text) {
    if (text) term.write('\r\n\x1b[90m[' + text + ']\x1b[0m\r\n');
  };
  window.fitNow = function () { fit(); };
  window.dimensions = function () { return [term.cols, term.rows]; };

  window.report = function () {
    const holder = document.getElementById('terminal');
    const cell = cellSize();
    console.log('DIMS cols=' + term.cols + ' rows=' + term.rows +
                ' w=' + holder.clientWidth + ' h=' + holder.clientHeight +
                ' cell=' + cell.w.toFixed(2) + 'x' + cell.h.toFixed(2) +
                ' dpr=' + window.devicePixelRatio);
  };

  function send(obj) {
    console.log('OSTLR:' + btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
  }
  term.onData(function (data) { send({ k: data }); });
  term.onResize(function (size) { send({ r: [size.cols, size.rows] }); });

  // --- diagnostics ---------------------------------------------------------
  // `const term` is a lexical binding, not a window property, so runJavaScript
  // cannot see it. Without this object every measurement from Python silently
  // read zeros - which is worse than having no numbers at all. These counters are
  // cheap, always on, and are what `--selftest` and the fps probe read.
  window.ostlr = {
    stats: { bytes: 0, writes: 0, since: performance.now(), lastWrite: 0,
             maxGap: 0, parseMs: 0 },
    write: function (b64) {
      const s = this.stats;
      const now = performance.now();
      if (s.lastWrite) {
        const gap = now - s.lastWrite;
        if (gap > s.maxGap) s.maxGap = gap;
      }
      s.lastWrite = now;
      window.writeB64(b64);
      s.bytes += Math.floor(b64.length * 3 / 4);
      s.writes += 1;
    },
    snapshot: function () {
      const s = this.stats;
      const elapsed = (performance.now() - s.since) / 1000;
      return [term.cols, term.rows, s.bytes, s.writes,
              elapsed > 0 ? s.writes / elapsed : 0, s.maxGap,
              term.buffer.active.length, term.buffer.active.type];
    },
    reset: function () {
      this.stats = { bytes: 0, writes: 0, since: performance.now(), lastWrite: 0,
                     maxGap: 0, parseMs: 0 };
      return true;
    },
    // The font contract, measured in the page: 2.000 or the borders will drift.
    font: function () {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.font = term.options.fontSize + 'px ' + term.options.fontFamily;
      const ascii = ctx.measureText('M').width;
      const cjk = ctx.measureText('\u4e2d').width;
      return JSON.stringify([term.options.fontFamily, ascii, cjk,
                             cjk / (ascii || 1)]);
    }
  };

  let pending = null;
  new ResizeObserver(function () {
    if (pending) clearTimeout(pending);
    pending = setTimeout(fit, 50);
  }).observe(document.getElementById('terminal'));

  // Fonts settle late; the first fit can measure before they do. Three tries
  // cost nothing and remove the "wrong grid on first paint" class of bug.
  [20, 150, 400, 900].forEach(function (delay) { setTimeout(fit, delay); });
  window.termReady = true;
</script>
</body>
</html>
