<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101216; overflow: hidden; }
  #terminal { position: absolute; inset: 0; padding: 4px 2px 2px 6px; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #2a2f38; border-radius: 5px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="vendor/xterm.js"></script>
<script>
  const term = new Terminal({
    fontFamily: 'Consolas, "Cascadia Mono", monospace',
    fontSize: 14,
    lineHeight: 1.0,
    letterSpacing: 0,
    cursorBlink: true,
    allowProposedApi: true,
    theme: {
      background: '#101216', foreground: '#e6e6e6', cursor: '#7cc4ff',
      selectionBackground: '#2a3a4a',
      black: '#1a1d22', red: '#f06a6a', green: '#7ec97e', yellow: '#e2c07c',
      blue: '#6aa9f0', magenta: '#c88ae0', cyan: '#6fd0d0', white: '#d8d8d8',
      brightBlack: '#5a6068', brightRed: '#ff8a8a', brightGreen: '#a0e0a0',
      brightYellow: '#f0d89a', brightBlue: '#8ac0ff', brightMagenta: '#e0a8f0',
      brightCyan: '#9ae8e8', brightWhite: '#ffffff'
    },
    scrollback: 5000,
    convertEol: false,
  });
  term.open(document.getElementById('terminal'));

  // --- fit -----------------------------------------------------------------
  // A TUI draws for the size it is told. Without fitting, the child believes it
  // owns 100x30 cells while the pane is a different pixel size, and every box
  // comes out wrong - the "projV 缩放不对" symptom.
  function measureCell() {
    // Measure one cell by writing a known string into an offscreen span styled
    // like the terminal; this survives any font substitution.
    const probe = document.createElement('span');
    probe.textContent = 'W';
    const style = window.getComputedStyle(document.querySelector('.xterm'));
    probe.style.fontFamily = style.fontFamily;
    probe.style.fontSize = style.fontSize;
    probe.style.lineHeight = style.lineHeight;
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    document.body.appendChild(probe);
    const rect = probe.getBoundingClientRect();
    document.body.removeChild(probe);
    return { w: rect.width || 8, h: rect.height || 16 };
  }

  function fit() {
    const holder = document.getElementById('terminal');
    const cell = measureCell();
    const cols = Math.max(20, Math.floor((holder.clientWidth - 8) / cell.w));
    const rows = Math.max(5, Math.floor((holder.clientHeight - 6) / cell.h));
    if (cols !== term.cols || rows !== term.rows) {
      term.resize(cols, rows);
    }
    send({ r: [term.cols, term.rows] });
  }

  // --- bridge ---------------------------------------------------------------
  window.writeB64 = function (b64) {
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    term.write(new TextDecoder('utf-8', { fatal: false }).decode(bytes));
  };

  window.setStatus = function (text) {
    if (text) term.write('\r\n\x1b[90m[' + text + ']\x1b[0m\r\n');
  };

  window.fitNow = function () { fit(); };

  function send(obj) {
    console.log('OSTLR:' + btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
  }

  term.onData(function (data) { send({ k: data }); });
  term.onResize(function (size) { send({ r: [size.cols, size.rows] }); });

  let lastW = 0, lastH = 0;
  new ResizeObserver(function () {
    const holder = document.getElementById('terminal');
    if (holder.clientWidth === lastW && holder.clientHeight === lastH) return;
    lastW = holder.clientWidth; lastH = holder.clientHeight;
    fit();
  }).observe(document.getElementById('terminal'));

  // First fit after layout settles, then a second one after fonts load.
  setTimeout(fit, 30);
  setTimeout(fit, 300);
  window.termReady = true;
</script>
</body>
</html>
